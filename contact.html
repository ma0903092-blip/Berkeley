<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
   <nav class="navbar">

        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" style="filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.7));">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <rect x="9" y="11" width="6" height="5" rx="1" fill="#38bdf8" fill-opacity="0.3"></rect>
            <path d="M10 11V9a2 2 0 1 1 4 0v2"></path>
            <line x1="3" y1="12" x2="21" y2="12" stroke="#38bdf8" stroke-width="2.5" style="filter: drop-shadow(0 0 5px #38bdf8);"></line>
        </svg>
        <span class="logo-text">Berkeley</span>

    <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

    <main class="main-container">
        <h1 class="main-title" style="font-size: 2.5rem; margin-bottom: 0.5rem; text-align: center;">Decrypt Comms</h1>
        <p class="main-subtitle" style="text-align: center; margin-bottom: 2.5rem;">Establish a secure transmission channel for professional collaborations or inquiries.</p>

        <div style="max-width: 550px; margin: 0 auto; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 2.5rem; border-radius: 14px; border: 1.5px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);">
            <div style="text-align: center; margin-bottom: 1.8rem;">
                <h3 style="color: #38bdf8; letter-spacing: 1.5px; font-size: 1.1rem; margin: 0;">// SECURE TRANSMISSION GATEWAY</h3>
            </div>
            
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div>
                    <label style="display: block; color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.4rem; letter-spacing: 0.5px;">YOUR EMAIL ADDRESS</label>
                    <input type="email" placeholder="name@domain.com" required style="width: 100%; padding: 0.8rem 1rem; background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; color: #ffffff; outline: none; transition: all 0.3s ease; box-sizing: border-box;" onfocus="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 10px rgba(56, 189, 248, 0.4)'" onblur="this.style.borderColor='rgba(56, 189, 248, 0.3)'; this.style.boxShadow='none'">
                </div>

                <div>
                    <label style="display: block; color: #94a3b8; font-size: 0.85rem; margin-bottom: 0.4rem; letter-spacing: 0.5px;">SECURE MESSAGE</label>
                    <textarea rows="4" placeholder="Enter your transmission content..." required style="width: 100%; padding: 0.8rem 1rem; background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; color: #ffffff; outline: none; resize: vertical; transition: all 0.3s ease; box-sizing: border-box;" onfocus="this.style.borderColor='#38bdf8'; this.style.boxShadow='0 0 10px rgba(56, 189, 248, 0.4)'" onblur="this.style.borderColor='rgba(56, 189, 248, 0.3)'; this.style.boxShadow='none'"></textarea>
                </div>

                <div style="text-align: center; margin-top: 0.5rem;">
                    <button type="submit" style="width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; padding: 0.85rem; border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 8px; font-weight: 600; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 15px rgba(2, 132, 199, 0.5); transition: all 0.3s ease;" onmouseover="this.style.boxShadow='0 0 20px rgba(56, 189, 248, 0.8)'" onmouseout="this.style.boxShadow='0 0 15px rgba(2, 132, 199, 0.5)'">TRANSMIT MESSAGE</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 Berkeley. All rights reserved.
    </footer>
</body>
</html>
