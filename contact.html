<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkeley | Contact</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Cyber Genius Glowing CSS by Berkeley */

        /* 1. The main form container glow (when cursor is NEAR) */
        .glowing-contact-container {
            max-width: 540px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.85); /* Slightly darker for better contrast */
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 16px;
            
            /* Initial State (Dormant) */
            border: 1.5px solid rgba(56, 189, 248, 0.3); /* Subtle blue boundary */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); /* Very faint soft glow */
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); /* Smooth pro transition */
            position: relative;
        }

        /* The dynamic hover activation */
        .glowing-contact-container:hover {
            border-color: #38bdf8; /* Full bright cyan border */
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.35), /* Outer bloom glow */
                        inset 0 0 20px rgba(56, 189, 248, 0.15); /* Internal subtle gloss */
            transform: translateY(-4px); /* Slight elevation for depth */
        }

        /* 2. Stylizing input fields for interaction */
        .cyber-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(3, 7, 18, 0.7);
            
            /* Inputs Initial State */
            border: 1.5px solid rgba(56, 189, 248, 0.3); /* Subtle border matching dormant container */
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none; /* Crucial for custom focus style */
            transition: all 0.3s ease-in-out;
            box-sizing: border-box; /* Fixes padding issues */
        }

        /* 3. The focused field glow (when cursor is INSIDE) */
        .cyber-input:focus {
            border-color: #38bdf8; /* Highlights border */
            background: rgba(15, 23, 42, 1); /* Direct clear backdrop */
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5), /* Focus bloom */
                        inset 0 0 8px rgba(56, 189, 248, 0.2); /* Internal focus depth */
        }

        /* Make textarea resize handle match the cyber theme */
        textarea.cyber-input {
            resize: vertical;
        }
    </style>
</head>
<body>
    <nav class="navbar">
       <div class="logo">
            <a href="index.html" class="logo-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" style="filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <rect x="9" y="10" width="6" height="5" rx="1" fill="#38bdf8" fill-opacity="0.3"></rect>
                    <path d="M10 10V8a2 2 0 0 1 4 0v2"></path>
                    <line x1="3" y1="12" x2="21" y2="12" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"></line>
                </svg>
                Berkeley
            </a>
        </div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="main-container">
        <h1 class="main-title" style="font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center;">Decrypt Comms</h1>
        <p class="main-subtitle" style="text-align: center; margin-bottom: 2.5rem; color: #94a3b8; font-size: 1rem;">Establish a secure transmission channel for professional collaborations or inquiries.</p>

        <!-- Applying the new glowing-contact-container class -->
        <div class="glowing-contact-container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h3 style="color: #38bdf8; letter-spacing: 2px; font-size: 1.05rem; font-weight: 600; margin: 0; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);">SECURE TRANSMISSION GATEWAY</h3>
            </div>
            
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 1.4rem;">
                <div>
                    <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 1px;">YOUR EMAIL ADDRESS</label>
                    <input type="email" placeholder="name@domain.com" required class="cyber-input">
                </div>

                <div>
                    <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 1px;">SECURE MESSAGE</label>
                    <textarea rows="4" placeholder="Enter your transmission content..." required class="cyber-input"></textarea>
                </div>

                <div style="text-align: center; margin-top: 0.6rem;">
                    <button type="submit" style="width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #ffffff; padding: 0.9rem; border: 1.5px solid rgba(56, 189, 248, 0.6); border-radius: 8px; font-weight: 600; font-size: 0.95rem; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 0 15px rgba(2, 132, 199, 0.5); transition: all 0.3s ease;" onmouseover="this.style.boxShadow='0 0 25px rgba(56, 189, 248, 0.8)'; this.style.background='linear-gradient(135deg, #0284c7 0%, #0284c7 100%)'" onmouseout="this.style.boxShadow='0 0 15px rgba(2, 132, 199, 0.5)'; this.style.background='linear-gradient(135deg, #0284c7 0%, #0369a1 100%)'">TRANSMIT MESSAGE</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p style="margin: 0;">&copy; 2026 Berkeley. All Rights Reserved.</p>
    </footer>
</body>
</html>
