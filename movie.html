<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkeley | Cinematic Database</title>
    <link rel="icon" type="image/jpeg" href="new_logo.jpg">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Cyberpunk Navbar -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f3f4f6;">
                <img src="new_logo.jpg" alt="Logo" class="nav-logo-img" style="width: 35px; height: 35px; border-radius: 50%;">
                <span>Berkeley</span>
            </a>
        </div>
        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- Matrix Background Canvas -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Main Content -->
    <main class="main-container" style="padding-top: 100px; flex: 1;">
        <h1 class="main-title">CINEMATIC DATABASE</h1>
        <p class="main-subtitle">Query global media archives via OMDb telemetry.</p>

        <!-- Movie Search Card -->
        <div class="card home-card" style="max-width: 600px; width: 90%; margin: 25px auto; padding: 25px;">
            <h2 style="color: #f3f4f6; margin-bottom: 15px; text-align: center;">Media Archive Search</h2>
            
            <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="searchInput" placeholder="Enter movie title (e.g. Inception, Matrix)..." style="flex: 1; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(56, 189, 248, 0.4); color: #f3f4f6; padding: 10px 14px; border-radius: 6px; outline: none;">
                <button onclick="searchMovie()" class="btn" style="padding: 10px 18px;">Search</button>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" style="display: none; text-align: center; color: #4ecca3; font-family: monospace; margin: 15px 0;">
                [..] Accessing archives...
            </div>

            <!-- Results Container -->
            <div id="movieResult" style="margin-top: 20px; font-family: monospace;"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>&copy; 2026 Berkeley. All Rights Reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="movie.js"></script>
    <script src="script.js"></script>
</body>
</html>
